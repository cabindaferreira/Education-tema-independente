openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room catalogue and booking availability
  - name: reservations
    description: Room reservation requests
  - name: course-enrollments
    description: Course enrollment and ProxyPay checkout
  - name: auth
    description: Signed-in user profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List rooms available for booking
      responses:
        "200":
          description: Available rooms and booking terms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
  /room-availability:
    post:
      operationId: checkRoomAvailability
      tags: [rooms]
      summary: Get available booking slots for a room and date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomAvailabilityInput"
      responses:
        "200":
          description: Available slots for the requested day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomAvailability"
        "400":
          description: Invalid date, room, or booking period
  /room-reservations:
    post:
      operationId: createRoomReservation
      tags: [reservations]
      summary: Reserve an available room slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomReservationInput"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomReservation"
        "400":
          description: Invalid reservation details
        "409":
          description: The selected slot is no longer available
  /course-enrollments:
    post:
      operationId: createCourseEnrollment
      tags: [course-enrollments]
      summary: Create a course enrollment and payment reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEnrollmentInput"
      responses:
        "201":
          description: Enrollment created with a pending payment reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentCheckout"
        "400":
          description: Invalid enrollment details
        "502":
          description: ProxyPay could not create the payment reference
        "503":
          description: Payment service is not configured
  /course-enrollments/{id}:
    get:
      operationId: getCourseEnrollmentStatus
      tags: [course-enrollments]
      summary: Get public payment status for an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Enrollment payment status without personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentStatus"
        "404":
          description: Enrollment not found
  /proxypay/webhook:
    post:
      operationId: receiveProxyPayPayment
      tags: [course-enrollments]
      summary: Receive a signed ProxyPay payment notification
      description: The signature is verified against the raw request body before processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyPayPaymentEvent"
      responses:
        "200":
          description: Payment notification processed
        "400":
          description: Invalid payment notification
        "401":
          description: Invalid ProxyPay signature
        "500":
          description: Payment confirmation email could not be sent
  /auth/profile:
    post:
      operationId: syncAuthProfile
      tags: [auth]
      summary: Create or refresh the signed-in user's application profile
      responses:
        "200":
          description: Synchronized application profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
    get:
      operationId: getAuthProfile
      tags: [auth]
      summary: Get the signed-in user's application profile
      responses:
        "200":
          description: Application profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
        "404":
          description: Profile not synchronized yet
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      required: [id, email, firstName, lastName, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Clerk user ID
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomId:
      type: string
      enum: [sala-soba, sala-kilamba, sala-kudi, sala-ondjango]
    ReservationPeriod:
      type: string
      enum: [standard, after_hours, session]
    Room:
      type: object
      required: [id, name, capacity, description, image, facilities, rateDetails]
      properties:
        id:
          $ref: "#/components/schemas/RoomId"
        name:
          type: string
        capacity:
          type: integer
        description:
          type: string
        image:
          type: string
        facilities:
          type: array
          items:
            type: string
        rateDetails:
          type: array
          items:
            type: string
    RoomList:
      type: array
      items:
        $ref: "#/components/schemas/Room"
    RoomSlot:
      type: object
      required: [id, startTime, endTime, durationMinutes, priceKz, period]
      properties:
        id:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        durationMinutes:
          type: integer
        priceKz:
          type: integer
        period:
          $ref: "#/components/schemas/ReservationPeriod"
    RoomAvailability:
      type: object
      required: [roomId, date, slots]
      properties:
        roomId:
          $ref: "#/components/schemas/RoomId"
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in YYYY-MM-DD format
        slots:
          type: array
          items:
            $ref: "#/components/schemas/RoomSlot"
    RoomAvailabilityInput:
      type: object
      required: [roomId, date, period]
      properties:
        roomId:
          $ref: "#/components/schemas/RoomId"
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in YYYY-MM-DD format
        period:
          $ref: "#/components/schemas/ReservationPeriod"
        durationHours:
          type: integer
          minimum: 1
          maximum: 9
    RoomReservationInput:
      type: object
      required: [roomId, date, slotId, period, name, nif]
      properties:
        roomId:
          $ref: "#/components/schemas/RoomId"
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in YYYY-MM-DD format
        slotId:
          type: string
        period:
          $ref: "#/components/schemas/ReservationPeriod"
        durationHours:
          type: integer
          minimum: 1
          maximum: 9
        name:
          type: string
          minLength: 2
          maxLength: 120
        company:
          type: ["string", "null"]
          maxLength: 160
        nif:
          type: string
          minLength: 3
          maxLength: 32
    RoomReservation:
      type: object
      required: [id, roomId, roomName, date, startTime, endTime, durationMinutes, priceKz, status]
      properties:
        id:
          type: integer
        roomId:
          $ref: "#/components/schemas/RoomId"
        roomName:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date in YYYY-MM-DD format
        startTime:
          type: string
        endTime:
          type: string
        durationMinutes:
          type: integer
        priceKz:
          type: integer
        status:
          type: string
    CourseId:
      type: string
      enum:
        - crm
        - tesouraria
        - lideranca-equipas
        - gestao-comercial
        - gestao-empresas
        - recursos-humanos
    CourseEnrollmentInput:
      type: object
      required:
        - courseId
        - fullName
        - birthDate
        - identityNumber
        - nationality
        - phone
        - email
        - address
        - municipality
        - province
        - profession
        - maritalStatus
        - privacyAccepted
      properties:
        courseId:
          $ref: "#/components/schemas/CourseId"
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        birthDate:
          type: string
          format: date
        identityNumber:
          type: string
          minLength: 3
          maxLength: 40
        nationality:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          minLength: 6
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
          minLength: 3
          maxLength: 240
        municipality:
          type: string
          minLength: 2
          maxLength: 100
        province:
          type: string
          minLength: 2
          maxLength: 100
        profession:
          type: string
          minLength: 2
          maxLength: 120
        maritalStatus:
          type: string
          minLength: 2
          maxLength: 40
        privacyAccepted:
          type: boolean
          enum: [true]
    CourseEnrollmentCheckout:
      type: object
      required:
        - id
        - courseId
        - courseTitle
        - amountKz
        - paymentEntity
        - paymentReference
        - paymentStatus
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        courseId:
          $ref: "#/components/schemas/CourseId"
        courseTitle:
          type: string
        amountKz:
          type: integer
        paymentEntity:
          type: string
        paymentReference:
          type: string
        paymentStatus:
          $ref: "#/components/schemas/CoursePaymentStatus"
        expiresAt:
          type: string
          format: date-time
    CourseEnrollmentStatus:
      allOf:
        - $ref: "#/components/schemas/CourseEnrollmentCheckout"
        - type: object
          required:
            - confirmationEmailStatus
          properties:
            confirmationEmailStatus:
              type: string
              enum: [pending, sent]
            paidAt:
              type: ["string", "null"]
              format: date-time
    CoursePaymentStatus:
      type: string
      enum: [pending, paid, review_required, expired]
    ProxyPayPaymentEvent:
      type: object
      required: [transaction_id, reference_id, amount]
      properties:
        transaction_id:
          type: integer
        reference_id:
          type: integer
        amount:
          type: string
        terminal_type:
          type: ["string", "null"]
        terminal_transaction_id:
          type: ["integer", "null"]

