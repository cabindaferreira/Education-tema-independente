openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room catalogue and booking availability
  - name: reservations
    description: Room reservation requests
  - name: course-enrollments
    description: Course enrollment and ProxyPay checkout
  - name: auth
    description: Signed-in user profile
  - name: newsletter
    description: Newsletter signup operations
  - name: admin
    description: Academy administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List rooms available for booking
      responses:
        "200":
          description: Available rooms and booking terms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
  /rooms/{roomId}/photos:
    get:
      operationId: listRoomPhotos
      tags: [rooms]
      summary: List active gallery photos for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoomId"
      responses:
        "200":
          description: Room gallery photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomGalleryPhotoList"
        "404":
          description: Room not found
  /courses:
    get:
      operationId: listPublishedCourses
      tags: [course-enrollments]
      summary: List publicly visible courses
      responses:
        "200":
          description: Published courses available to the public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourseList"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check the signed-in user's Academy administration access
      responses:
        "200":
          description: Current account access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Sign-in required
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administration dashboard counts
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/courses:
    get:
      operationId: listAdminCourses
      tags: [admin]
      summary: List all courses, including unpublished courses
      responses:
        "200":
          description: Course catalogue for administrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourseList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
    post:
      operationId: createAdminCourse
      tags: [admin]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCourseCreateInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          description: Invalid course details
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "409":
          description: Course ID already exists
  /admin/courses/{courseId}:
    patch:
      operationId: updateAdminCourse
      tags: [admin]
      summary: Edit a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCourseUpdateInput"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          description: Invalid course details
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Course not found
  /admin/courses/{courseId}/archive:
    post:
      operationId: archiveAdminCourse
      tags: [admin]
      summary: Remove a course from the active catalogue without deleting its history
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      responses:
        "200":
          description: Course archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Course not found
  /admin/team:
    get:
      operationId: listAdminTeam
      tags: [admin]
      summary: List administrators and authorized staff
      responses:
        "200":
          description: Academy users with administration access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamList"
        "401":
          description: Sign-in required
        "403":
          description: Owner access required
    post:
      operationId: authorizeAdminTeamMember
      tags: [admin]
      summary: Grant administration access to an existing verified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamMemberInput"
      responses:
        "200":
          description: Administration access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamMember"
        "400":
          description: Email is invalid or not verified
        "401":
          description: Sign-in required
        "403":
          description: Owner access required
        "404":
          description: The user must create an account before being authorized
  /admin/team/{userId}:
    delete:
      operationId: revokeAdminTeamMember
      tags: [admin]
      summary: Revoke a collaborator's administration access
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Access revoked
        "400":
          description: The owner cannot be removed
        "401":
          description: Sign-in required
        "403":
          description: Owner access required
        "404":
          description: Authorized user not found
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Search course and room customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Matching customers and recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomerList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/media:
    get:
      operationId: listAdminMedia
      tags: [admin]
      summary: List active media assets
      responses:
        "200":
          description: Media library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMediaList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
    post:
      operationId: createAdminMedia
      tags: [admin]
      summary: Register an uploaded image in the media library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMediaInput"
      responses:
        "201":
          description: Media asset registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMedia"
        "400":
          description: Invalid upload metadata
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/media/{id}:
    patch:
      operationId: updateAdminMedia
      tags: [admin]
      summary: Update the room association of an active media asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMediaUpdate"
      responses:
        "200":
          description: Media asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMedia"
        "400":
          description: Invalid media identifier or room
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Active media asset not found
    delete:
      operationId: removeAdminMedia
      tags: [admin]
      summary: Remove an unused media asset from the library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Media asset removed
        "400":
          description: Media asset is still used by a course
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Media asset not found
  /storage/uploads/request-url:
    post:
      operationId: requestAdminMediaUploadUrl
      tags: [admin]
      summary: Get a short-lived upload URL for an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUploadUrlInput"
      responses:
        "200":
          description: Temporary upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUploadUrl"
        "400":
          description: Unsupported image type or file size
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/agenda:
    get:
      operationId: getAdminAgenda
      tags: [admin]
      summary: List room reservations and blocked periods for one day
      parameters:
        - name: roomId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RoomId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Reservations and blocked periods for the selected room and date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAgenda"
        "400":
          description: Invalid room or date
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /admin/room-blocks:
    get:
      operationId: listAdminRoomBlocks
      tags: [admin]
      summary: List blocked periods for a room and date
      parameters:
        - name: roomId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RoomId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Active blocked periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomAvailabilityBlockList"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
    post:
      operationId: createAdminRoomBlock
      tags: [admin]
      summary: Block an available room period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomAvailabilityBlockInput"
      responses:
        "201":
          description: Period blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomAvailabilityBlock"
        "400":
          description: Invalid period
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "409":
          description: Period conflicts with a reservation or existing block
  /admin/room-blocks/{id}:
    delete:
      operationId: releaseAdminRoomBlock
      tags: [admin]
      summary: Release a previously blocked room period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Period released
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "404":
          description: Active block not found
  /room-booking-settings:
    get:
      operationId: getRoomBookingSettings
      tags: [rooms]
      summary: Get current room booking prices and schedules for academy staff
      responses:
        "200":
          description: Current editable booking rules and holiday dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBookingSettings"
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
    put:
      operationId: updateRoomBookingSettings
      tags: [rooms]
      summary: Replace room booking prices, schedules, and holiday dates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomBookingSettingsUpdate"
      responses:
        "200":
          description: Updated booking rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBookingSettings"
        "400":
          description: Invalid booking settings
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
  /room-availability:
    post:
      operationId: checkRoomAvailability
      tags: [rooms]
      summary: Get available booking slots for a room and date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomAvailabilityInput"
      responses:
        "200":
          description: Available slots for the requested day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomAvailability"
        "400":
          description: Invalid date, room, or booking period
  /room-reservations:
    get:
      operationId: listRoomReservations
      tags: [reservations]
      summary: List room reservations for academy staff
      parameters:
        - name: roomId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RoomId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Reservations for the selected room and date without tax identification numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStaffReservationList"
        "400":
          description: Invalid room or date
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
    post:
      operationId: createRoomReservation
      tags: [reservations]
      summary: Reserve an available room slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomReservationInput"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomReservation"
        "400":
          description: Invalid reservation details
        "409":
          description: The selected slot is no longer available
  /room-reservations/{id}/cancel:
    patch:
      operationId: cancelRoomReservation
      tags: [reservations]
      summary: Cancel a room reservation as academy staff
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStaffReservation"
        "400":
          description: Invalid reservation identifier
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
        "404":
          description: Reservation not found
  /course-enrollments:
    post:
      operationId: createCourseEnrollment
      tags: [course-enrollments]
      summary: Create a course enrollment and payment reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEnrollmentInput"
      responses:
        "201":
          description: Enrollment created with a pending payment reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentCheckout"
        "400":
          description: Invalid enrollment details
        "502":
          description: ProxyPay could not create the payment reference
        "503":
          description: Payment service is not configured
  /course-enrollment-requests:
    post:
      operationId: createCourseEnrollmentRequest
      tags: [course-enrollments]
      summary: Send a course enrollment request to the Academy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEnrollmentRequestInput"
      responses:
        "201":
          description: Request delivered to the Academy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentRequestResponse"
        "400":
          description: Invalid request details or missing privacy acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentRequestError"
        "502":
          description: Request email could not be delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentRequestError"
  /course-enrollments/{id}:
    get:
      operationId: getCourseEnrollmentStatus
      tags: [course-enrollments]
      summary: Get public payment status for an enrollment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Enrollment payment status without personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentStatus"
        "404":
          description: Enrollment not found
  /course-enrollments/{id}/renew-reference:
    post:
      operationId: renewCourseEnrollmentReference
      tags: [course-enrollments]
      summary: Renew an expired course enrollment payment reference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Replacement payment details without personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentCheckout"
        "404":
          description: Enrollment not found
        "409":
          description: Enrollment is not eligible for reference renewal
        "429":
          description: A recent renewal request is already in progress
        "502":
          description: ProxyPay could not create the replacement reference
        "503":
          description: Payment service is not configured
  /course-enrollments/staff:
    get:
      operationId: listStaffCourseEnrollments
      tags: [course-enrollments]
      summary: Search course enrollments for authorized staff
      parameters:
        - name: courseId
          in: query
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/CoursePaymentStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Filtered enrollment details and payment action history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffCourseEnrollmentList"
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
  /course-enrollments/{id}/resolve:
    post:
      operationId: resolveStaffCourseEnrollment
      tags: [course-enrollments]
      summary: Record a staff decision for a payment exception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCourseEnrollmentPayment"
      responses:
        "200":
          description: Payment exception resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffCourseEnrollment"
        "400":
          description: Invalid resolution
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
        "404":
          description: Payment exception not found
  /course-enrollments/{id}/retry-confirmation:
    post:
      operationId: retryStaffCourseEnrollmentConfirmation
      tags: [course-enrollments]
      summary: Retry a failed payment confirmation email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmation email retry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffCourseEnrollment"
        "401":
          description: Sign-in required
        "403":
          description: Staff access required
        "404":
          description: Enrollment or failed email not found
        "409":
          description: Confirmation email is not currently retryable
        "502":
          description: Confirmation email retry failed and was recorded
  /proxypay/webhook:
    post:
      operationId: receiveProxyPayPayment
      tags: [course-enrollments]
      summary: Receive a signed ProxyPay payment notification
      description: The signature is verified against the raw request body before processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyPayPaymentEvent"
      responses:
        "200":
          description: Payment notification processed
        "400":
          description: Invalid payment notification
        "401":
          description: Invalid ProxyPay signature
        "500":
          description: Payment confirmation email could not be sent
  /auth/profile:
    post:
      operationId: syncAuthProfile
      tags: [auth]
      summary: Create or refresh the signed-in user's application profile
      responses:
        "200":
          description: Synchronized application profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
    get:
      operationId: getAuthProfile
      tags: [auth]
      summary: Get the signed-in user's application profile
      responses:
        "200":
          description: Application profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
        "404":
          description: Profile not synchronized yet
  /newsletter-signups:
    post:
      operationId: subscribeToNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSignupInput"
      responses:
        "201":
          description: Signup saved and confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignupResponse"
        "200":
          description: Email address is already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignupResponse"
        "400":
          description: Email address is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignupError"
        "502":
          description: Confirmation email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignupError"
  /newsletter-unsubscriptions:
    post:
      operationId: unsubscribeFromNewsletter
      tags: [newsletter]
      summary: Unsubscribe from the newsletter with an emailed token
      description: The token is stored as a hash. Opening the email link does not unsubscribe; the recipient must confirm the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterUnsubscribeInput"
      responses:
        "200":
          description: Subscription is now inactive or was already inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterUnsubscribeResponse"
        "400":
          description: Token is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterUnsubscribeError"
        "404":
          description: Token is unknown or has been superseded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterUnsubscribeError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NewsletterSignupInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    NewsletterSignupResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmation_sent, already_subscribed]
    NewsletterSignupError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_email, email_delivery_failed]
    NewsletterUnsubscribeInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
    NewsletterUnsubscribeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unsubscribed, already_unsubscribed]
    NewsletterUnsubscribeError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_unsubscribe_token]
    UserProfile:
      type: object
      required: [id, email, firstName, lastName, createdAt, updatedAt]
      properties:
        id:
          type: string
